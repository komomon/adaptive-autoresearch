experiment:
  name: multi-vuln-autoresearch
  profile: generic-vuln-audit
  adapter: codex
  versioning:
    backend: git
    git:
      use_worktree: true
      branch_prefix: autoresearch/
    local_dir:
      snapshots_root: ./autoresearch-results/snapshots
  target_project:
    kind: agent-team
    repo_path: ../your-target-project
    invocation:
      mode: claude-agent-sdk-python
      cwd: ../your-target-project

      # ── Connection ──────────────────────────────────────
      model: deepseek-v4-pro                   # Model name (or use model_env for env var)
      # model_env: MODEL_VAR                   #   Alternative: env var name for model
      api_key_env: ANTHROPIC_AUTH_TOKEN         # Env var name holding the API key
      base_url: https://api.deepseek.com/anthropic
      # base_url_env: BASE_URL_VAR             #   Alternative: env var name for base URL
      # temperature: 0.0                       # Sampling temperature (0.0-1.0)

      # ── Agent loop ─────────────────────────────────────
      max_turns: 12                             # Max SDK agent turns per query
      timeout_seconds: 3600                     # Total query timeout (seconds)
      max_attempts: 2                           # Retry attempts on failure
      retry_backoff_seconds: 2                  # Backoff between retries (seconds)
      max_timeout_extensions: 1                 # Auto-extend timeout N times on expiry

      # ── Thinking & effort ──────────────────────────────
      # thinking:                               # Thinking mode config
      #   type: adaptive                        #   disabled | enabled | adaptive
      # effort: high                            # low | medium | high

      # ── Tools & permissions ────────────────────────────
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash
      permission_mode: acceptEdits              # default | acceptEdits | bypassPermissions

      # ── Observability ──────────────────────────────────
      # heartbeat_interval: 60                  # Heartbeat log interval (seconds)
      # quiet: false                            # Suppress SDK output

      # ── Prompts ────────────────────────────────────────
      prompt_template: |
        Use the target project's security audit skill or agent-team workflow to analyze exactly one case.
        Follow the target project's own methodology.
        Do not use evaluation labels as answers.

        Case:
        {case_json}
      system_prompt: |
        You are running inside the target audit project.
        Analyze one case only.
        Prefer method-driven reasoning over pattern shortcuts.

      # ── Output ─────────────────────────────────────────
      output:
        mode: text-stdout

      # ── Canonicalization (second-pass LLM to normalize raw output) ──
      canonicalization:
        enabled: true
        runner: script
        script: ./harness/canonicalize_target_output.py
        mode: claude-agent-sdk-python

        # Connection (falls back to invocation if not set)
        model: deepseek-v4-pro
        api_key_env: ANTHROPIC_AUTH_TOKEN
        base_url: https://api.deepseek.com/anthropic
        cwd: ../your-target-project

        # Agent loop
        timeout_seconds: 120                    # Canonicalization timeout (seconds)
        # max_turns: 8                          # Max turns for canonicalization
        # max_timeout_extensions: 1             # Auto-extend timeout N times

        # Thinking & effort
        # thinking:
        #   type: adaptive
        # effort: high

        # Tools & permissions (defaults: all file tools + acceptEdits)
        # allowed_tools:
        #   - Read
        #   - Glob
        #   - Grep
        #   - Bash
        #   - Edit
        #   - MultiEdit
        #   - Write
        # permission_mode: acceptEdits

    result_contract: target-audit-result
    optimization_policy:
      methodology_first: true
      minimum_necessary_change: true
      allowed_axes:
        - role_split
        - dispatch_strategy
        - checkpoint_policy
        - evidence_schema
        - verifier_strength
        - context_packing
        - output_normalization
      forbidden_axes:
        - vulnerability_keyword_rules
        - field_name_shortcuts
        - framework_specific_special_cases
        - evaluation_set_memorization
    # If you want autoresearch to be able to modify the whole target project,
    # replace editable_scope with:
    #   - ./
    editable_scope:
      - prompts/
      - skills/
      - configs/
      - orchestrator/
      - agents/
    read_only_scope:
      - benchmarks/
      - holdout/
      - graders/
      - datasets/

dataset:
  source:
    kind: xlsx
    path: ./datasets/input.xlsx
    sheet: cases
  normalize_to: ./datasets/normalized-cases.jsonl
  normalization:
    mode: llm-assisted-when-sparse
    allow_sparse_rows: true
    auto_generate_case_id: true
    default_transport: other
    default_language: unknown
    mark_missing_fields_for_review: true
  column_mapping:
    case_id: case_id
    repo.url: repo_url
    repo.branch: repo_branch
    entry.name: entry_name
    entry.transport: transport
    entry.language: language
    expected.has_vulnerability: has_vulnerability
    expected.vulnerability_type: vulnerability_type
    expected.vuln_function_or_line: vuln_function_or_line
    notes: notes
  case_filter:
    # range: [1, 10]             # use cases 1-10 (1-based, inclusive)
    # indices: [1, 3, 5]         # use only these indices (1-based)
    # case_ids: ["row-00001"]    # use only these case_ids
  split:
    dev: 0.50
    holdout: 0.25
    cross_repo: 0.15
    canary: 0.10

execution:
  modes:
    - foreground
    - background
    - resume
  resume_completed_cases: true              # Skip cases with cached results
  rerun_low_quality_cases: false            # Re-run cached cases with no evidence/artifacts
  case_concurrency: 3
  candidate_evaluation:
    strategy: staged
  case_retry:
    max_attempts: 2
    backoff_seconds: 2
  packet:
    max_primary_change_count: 1
    max_dev_cases_per_round: 12
    require_checkpoint_after_each_chain_extension: true
  topology:
    default: S1
    escalation_order:
      - S0
      - S1
      - S2
      - S3

grading:
  primary_metric: verdict_match
  result_contract: target-audit-result
  match_rules:
    require_verdict_match: true
    require_type_match_when_available: true
    require_evidence_for_high_confidence: true
  aggregate_metrics:
    - accuracy
    - precision
    - recall
    - f1
  secondary_metrics:
    - evidence_adequacy
    - chain_completeness
    - confidence_calibration
    - false_positive_control
    - false_negative_control
    - business_invariant_coverage
  keep_gate:
    require_dev_improvement: true
    require_holdout_non_regression: true
    require_cross_repo_non_regression: true
    require_evidence_non_regression: false  # true when dataset has vuln_function_or_line annotations
    require_high_confidence_fp_non_regression: true

# ── Optimization model config ──────────────────────────────
# Merge priority: invocation → optimization.model → proposal/apply stage override
# Each stage inherits all keys from the layer below, then overrides with its own.
optimization:
  model:                                     # Shared base for propose & apply stages
    model: glm-5.1
    api_key_env: OPTIMIZATION_AUTH_TOKEN
    base_url: https://openai.mybank.cn/api/anthropic
    # timeout_seconds: 3600                  # Inherited by propose & apply unless overridden
    # max_timeout_extensions: 1
    # thinking:
    #   type: adaptive
    # effort: high

  # Propose stage — generates methodology improvement packets from failure analysis.
  # Inherits: invocation → optimization.model → this block
  # proposal:
  #   # Connection (inherits from optimization.model if not set)
  #   # model: glm-5.1
  #   # api_key_env: OPTIMIZATION_AUTH_TOKEN
  #   # base_url: https://openai.mybank.cn/api/anthropic
  #   # temperature: 0.0
  #   permission_mode: default              # Propose is read-only analysis
  #   max_turns: 8
  #   timeout_seconds: 3600
  #   max_timeout_extensions: 1
  #   # thinking:
  #   #   type: adaptive
  #   # effort: high

  # Apply stage — applies proposed edits to target project files.
  # Inherits: invocation → optimization.model → this block
  # apply:
  #   # Connection (inherits from optimization.model if not set)
  #   # model: glm-5.1
  #   # api_key_env: OPTIMIZATION_AUTH_TOKEN
  #   # base_url: https://openai.mybank.cn/api/anthropic
  #   permission_mode: acceptEdits         # Apply needs file write permissions
  #   allowed_tools:
  #     - Read
  #     - Glob
  #     - Grep
  #     - Edit
  #     - MultiEdit
  #     - Write
  #   max_turns: 18
  #   timeout_seconds: 3600
  #   max_timeout_extensions: 1
  #   # thinking:
  #   #   type: adaptive
  #   # effort: high

meta_optimization:
  enabled: true
  optimize_axes:
    - role_split
    - topology_activation
    - search_order
    - packet_selection_policy
    - verifier_intensity
    - context_packing
    - failure_taxonomy
    - lesson_merge_policy
  never_optimize:
    - expected_labels
    - holdout_membership
    - grading_rubric_meaning
    - vulnerability_taxonomy_semantics
    - hard_invariants

outputs:
  run_root: ./autoresearch-results
  ledgers:
    - run-state.json
    - scoreboard.json
    - candidate-ledger.jsonl
    - lesson-ledger.md
  case_artifacts:
    - entry_pack.json
    - path_pack.json
    - context_pack.json
    - guard_pack.json
    - evidence_pack.json
    - verdict.json
    - grading.json
