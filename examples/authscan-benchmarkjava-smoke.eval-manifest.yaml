experiment:
  name: authscan-benchmarkjava-smoke
  profile: authz-and-identity
  adapter: claudecode
  versioning:
    backend: git
    git:
      use_worktree: true
      branch_prefix: autoresearch/smoke/
    local_dir:
      snapshots_root: ./autoresearch-results/authscan-smoke/snapshots
  target_project:
    kind: skill
    repo_path: D:/ccode/aicode/gitcode/back/authscan-2
    invocation:
      mode: claude-agent-sdk-python
      cwd: D:/ccode/aicode/gitcode/back/authscan-2
      model: glm-5
      api_key_env: ANTHROPIC_AUTH_TOKEN
      base_url: https://openai.mybank.cn/api/anthropic
      prompt_template: |
        You are inside the authscan target project.
        Follow the preloaded skill and methodology files below.
        Analyze exactly one case against the repository indicated below.
        This is a smoke invocation for the target project call chain; do not read evaluation labels as answers.

        {preloaded_files}

        Case:
        {case_json}
      system_prompt: |
        Use the target project's own methodology.
        Prefer code-grounded reasoning.
        If the case does not fit authorization analysis, say so explicitly instead of inventing authorization findings.
      allowed_tools:
        - Read
        - Glob
        - Grep
      permission_mode: default
      thinking:
        type: adaptive
      effort: high
      max_turns: 12
      timeout_seconds: 3600
      max_attempts: 2
      retry_backoff_seconds: 2
      output:
        mode: text-stdout
      canonicalization:
        enabled: true
        runner: script
        script: ./harness/canonicalize_target_output.py
        mode: claude-agent-sdk-python
        cwd: D:/ccode/aicode/gitcode/back/authscan-2
        model: glm-5
        api_key_env: ANTHROPIC_AUTH_TOKEN
        base_url: https://openai.mybank.cn/api/anthropic
        timeout_seconds: 120
    result_contract: target-audit-result
    optimization_policy:
      methodology_first: true
      minimum_necessary_change: true
      allowed_axes:
        - role_split
        - dispatch_strategy
        - checkpoint_policy
        - evidence_schema
        - verifier_strength
        - context_packing
        - output_normalization
      forbidden_axes:
        - vulnerability_keyword_rules
        - field_name_shortcuts
        - framework_specific_special_cases
        - evaluation_set_memorization
    editable_scope:
      - ./
    read_only_scope: []

dataset:
  source:
    kind: jsonl
    path: ./adaptive-autoresearch/examples/smoke/benchmarkjava-two-cases.jsonl
  normalize_to: ./adaptive-autoresearch/examples/smoke/benchmarkjava-two-cases.jsonl
  case_filter:
    # range: [1, 10]             # use cases 1-10 (1-based, inclusive)
    # indices: [1, 3, 5]         # use only these indices (1-based)
    # case_ids: ["row-00001"]    # use only these case_ids
  split:
    dev: 0.50
    holdout: 0.25
    cross_repo: 0.15
    canary: 0.10

execution:
  modes:
    - foreground
    - background
    - resume
  resume_completed_cases: true
  case_concurrency: 3
  candidate_evaluation:
    strategy: staged
  case_retry:
    max_attempts: 2
    backoff_seconds: 2
  packet:
    max_primary_change_count: 1
    max_dev_cases_per_round: 2
    require_checkpoint_after_each_chain_extension: true
  topology:
    default: S1
    escalation_order:
      - S1
      - S2
      - S3

grading:
  primary_metric: verdict_match
  result_contract: target-audit-result
  match_rules:
    require_verdict_match: true
    require_type_match_when_available: false
    require_evidence_for_high_confidence: true
  aggregate_metrics:
    - accuracy
    - precision
    - recall
    - f1
  secondary_metrics:
    - evidence_adequacy
    - chain_completeness
    - confidence_calibration
    - false_positive_control
    - false_negative_control
  keep_gate:
    require_dev_improvement: true
    require_holdout_non_regression: true
    require_cross_repo_non_regression: true
    require_evidence_non_regression: true
    require_high_confidence_fp_non_regression: true

meta_optimization:
  enabled: true
  optimize_axes:
    - role_split
    - topology_activation
    - search_order
    - packet_selection_policy
    - verifier_intensity
    - context_packing
    - failure_taxonomy
    - lesson_merge_policy
  never_optimize:
    - expected_labels
    - holdout_membership
    - grading_rubric_meaning
    - vulnerability_taxonomy_semantics
    - hard_invariants

outputs:
  run_root: ./autoresearch-results
  ledgers:
    - run-state.json
    - scoreboard.json
    - candidate-ledger.jsonl
    - lesson-ledger.md
  case_artifacts:
    - entry_pack.json
    - path_pack.json
    - context_pack.json
    - guard_pack.json
    - evidence_pack.json
    - verdict.json
    - grading.json
